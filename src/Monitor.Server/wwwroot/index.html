<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Monitor Portoconseg</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231f5f8b'/%3E%3Cpath d='M9 17l4 4 10-10' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
</head>
<body>
  <div id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <h1>Monitor Portoconseg</h1>
      <label for="login-user">Usuário</label>
      <input id="login-user" name="username" autocomplete="username" required>
      <label for="login-pass">Senha</label>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
      <p id="login-error" class="error" hidden></p>
      <button type="submit" class="primary">Entrar</button>
    </form>
  </div>

  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand">Monitor Portoconseg</div>
      <nav id="nav">
        <a href="#dia" data-route="dia">Dia</a>
        <a href="#semana" data-route="semana">Semana</a>
        <a href="#classificar" data-route="classificar">Classificar</a>
        <a href="#computadores" data-route="computadores">Computadores</a>
        <a href="#horarios" data-route="horarios">Horários</a>
        <a href="#acessos" data-route="acessos">Acessos</a>
      </nav>
      <div class="user">
        <span id="user-name"></span>
        <button id="logout" class="link">Sair</button>
      </div>
    </header>
    <main id="main" class="main"></main>
  </div>

  <script src="app.js"></script>
</body>
</html>
